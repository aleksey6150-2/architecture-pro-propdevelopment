apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: RequestResponse
    verbs: ["create","delete","update","patch"]
    resources:
      - group: ""
        resources: ["pods"]
      - group: "rbac.authorization.k8s.io"
        resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]

  - level: RequestResponse
    verbs: ["get","list"]
    resources:
      - group: ""
        resources: ["secrets"]

  - level: Metadata
    resources:
      - group: "*"
        resources: ["*"]